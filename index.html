<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>WatcherCast Receiver</title>

    <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: black;
            overflow: hidden;
        }

        #video {
            width: 100%;
            height: 100%;
            background: black;
        }

        #status {
            position: absolute;
            left: 30px;
            top: 30px;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 28px;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 18px;
            border-radius: 8px;
            z-index: 10;
        }
    </style>
</head>

<body>
    <div id="status">WatcherCast Receiver gestart</div>

    <video id="video" autoplay controls></video>

    <script>
        const context = cast.framework.CastReceiverContext.getInstance();
        const playerManager = context.getPlayerManager();

        const video = document.getElementById("video");
        const statusBox = document.getElementById("status");

        function setStatus(text) {
            console.log("WATCHERCAST:", text);
            statusBox.textContent = text;
        }

        playerManager.setMessageInterceptor(
            cast.framework.messages.MessageType.LOAD,
            requestData => {
                console.log("WATCHERCAST LOAD:", requestData);

                const media = requestData.media;
                const videoUrl = media && media.contentId;
                const tracks = media && media.tracks ? media.tracks : [];

                if (!videoUrl) {
                    setStatus("Geen video URL ontvangen");
                    return requestData;
                }

                setStatus("Video laden...");

                video.innerHTML = "";
                video.src = videoUrl;

                if (tracks.length > 0) {
                    const firstTextTrack = tracks.find(t => t.type === "TEXT") || tracks[0];

                    if (firstTextTrack && firstTextTrack.trackContentId) {
                        const track = document.createElement("track");

                        track.kind = "subtitles";
                        track.label = firstTextTrack.name || "Subtitle";
                        track.srclang = firstTextTrack.language || "en";
                        track.src = firstTextTrack.trackContentId;
                        track.default = true;

                        video.appendChild(track);
                        fetch(firstTextTrack.trackContentId)
    .then(response => response.text())
    .then(text => {
        setStatus(
            "VTT DOWNLOAD OK\n" +
            text.substring(0, 100)
        );
    })
    .catch(error => {
        setStatus(
            "VTT DOWNLOAD ERROR\n" +
            error.message
        );
    });
















track.addEventListener("load", () => {
    if (video.textTracks && video.textTracks.length > 0) {
        video.textTracks[0].mode = "showing";

        setStatus(
            "SUBTITLE GELADEN\n" +
            "textTracks: " + video.textTracks.length
        );
    } else {
        setStatus("Track geladen, maar geen textTracks gevonden");
    }
});

track.addEventListener("error", () => {
    setStatus("SUBTITLE TRACK ERROR");
});

setStatus(
    "SUB URL:\n" +
    firstTextTrack.trackContentId
);
                    } else {
                        setStatus("Track aanwezig, maar geen subtitle URL");
                    }
                } else {
                    setStatus("Video laden zonder subtitle");
                }

                video.load();
                setTimeout(() => {

    setStatus(
        "TEXTTRACKS: " +
        video.textTracks.length
    );

    if (video.textTracks.length > 0) {

        video.textTracks[0].mode = "showing";

        setStatus(
            "SHOWING GEFORCEERD\n" +
            "Tracks: " +
            video.textTracks.length
        );
    }

}, 3000);

                video.play().then(() => {
                    setStatus(
    "VIDEO OK\n" +
    "Tracks: " + tracks.length
);
                    setTimeout(() => {
                        statusBox.style.display = "none";
                    }, 3000);
                }).catch(error => {
                    setStatus("Play error: " + error.message);
                });

                return null;
            }
        );

        context.start();
    </script>
</body>
</html>
