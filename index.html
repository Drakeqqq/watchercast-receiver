<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>WatcherCast Receiver</title>

    <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: black;
            overflow: hidden;
        }

        #video {
            width: 100%;
            height: 100%;
            background: black;
            display: none;
        }


        


#status {
    position: absolute;
    left: 30px;
    top: 30px;
    color: white;
    font-family: Arial, sans-serif;
    font-size: 28px;
    background: rgba(0, 0, 0, 0.6);
    padding: 12px 18px;
    border-radius: 8px;
    z-index: 10;
    display: none;
}

        









#subtitleBox {
    position: absolute;

    left: 50%;
    bottom: 5px;

    transform: translateX(-50%);

    width: 92%;
    max-width: 92%;

    color: white;
    font-size: 36px;
    font-family: Arial, sans-serif;
    font-weight: bold;

    text-align: center;
    line-height: 1.18;

    text-shadow:
        2px 2px 4px black,
        -2px -2px 4px black,
        2px -2px 4px black,
        -2px 2px 4px black;

    z-index: 9999;
    pointer-events: none;
}



#standbyScreen {
    position: absolute;
    inset: 0;

    background: black;

    display: flex;
    align-items: center;
    justify-content: center;

    z-index: 5000;
}

#castIcon {
    color: white;
    font-size: 110px;
    font-family: Arial, sans-serif;
    opacity: 0.85;
}





#standbyContent {
    display: flex;
    flex-direction: column;
    align-items: center;
}

#watcherText {
    margin-top: 18px;

    color: white;

    font-family: Arial, sans-serif;
    font-size: 32px;
    font-weight: bold;

    letter-spacing: 1px;

    opacity: 0.9;
}

#loadingText {
    margin-top: 10px;
    color: white;
    font-family: Arial, sans-serif;
    font-size: 18px;
    font-weight: normal;
    opacity: 0.75;
}


    </style>
</head>

<body>


    <div id="standbyScreen">

    <div id="standbyContent">

        <div id="castIcon">◉</div>

        <div id="watcherText">
            WatcherCast
        </div>
        <div id="loadingText"></div>

    </div>

</div>


<div id="status"></div>
<video id="video" autoplay controls></video>
<div id="subtitleBox"></div>


<script>
    const context = cast.framework.CastReceiverContext.getInstance();
    const playerManager = context.getPlayerManager();

    const video = document.getElementById("video");
    const statusBox = document.getElementById("status");
    const subtitleBox = document.getElementById("subtitleBox");
    const standbyScreen = document.getElementById("standbyScreen");
    const loadingText = document.getElementById("loadingText");
    let loadingTimer = null;
    const CONTROL_NAMESPACE = "urn:x-cast:com.example.watchercastv2.controls";
    let androidSenderId = null;

    let subtitleCues = [];
    let subtitleOffsetMs = 0;
    let subtitlesVisible = true;

    let ratioIndex = 2;

    const ratioModes = [
    { name: "Passend op scherm", mode: "fit" },
    { name: "Schermvullend", mode: "fill" },
    { name: "16:9", mode: "16x9" },
    { name: "4:3", mode: "4x3" },
    { name: "Centreren", mode: "center" },
    { name: "Best passend", mode: "bestfit" }
    ];

    
    function applyRatioMode(mode) {
    video.style.position = "absolute";
    video.style.left = "50%";
    video.style.top = "50%";
    video.style.transform = "translate(-50%, -50%)";
    video.style.background = "black";

    if (mode === "fit") {
        video.style.width = "100%";
        video.style.height = "100%";
        video.style.objectFit = "contain";
    }

    if (mode === "fill") {
        video.style.width = "100%";
        video.style.height = "100%";
        video.style.objectFit = "fill";
    }

    if (mode === "16x9") {
        video.style.width = "100%";
        video.style.height = "100%";
        video.style.objectFit = "fill";
    }

    if (mode === "4x3") {
        video.style.width = "133.33vh";
        video.style.height = "100vh";
        video.style.objectFit = "fill";
    }

    if (mode === "center") {
        video.style.width = "auto";
        video.style.height = "auto";
        video.style.maxWidth = "100%";
        video.style.maxHeight = "100%";
        video.style.objectFit = "none";
    }

    if (mode === "bestfit") {
        video.style.width = "100%";
        video.style.height = "100%";
        video.style.objectFit = "contain";
    }
}




function notifyAndroid(messageObject) {
    if (!androidSenderId) {
        return;
    }

    context.sendCustomMessage(
        CONTROL_NAMESPACE,
        androidSenderId,
        JSON.stringify(messageObject)
    );
}







setInterval(() => {

    notifyAndroid({
        action: "position",
        positionMs: Math.floor(video.currentTime * 1000)
    });

}, 1000);






    function setStatus(text, timeoutMs = 2000) {
    statusBox.textContent = text;
    statusBox.style.display = "block";

    clearTimeout(window.statusTimer);

    if (timeoutMs > 0) {
        window.statusTimer = setTimeout(() => {
            statusBox.style.display = "none";
        }, timeoutMs);
    }
}
    // Zet VTT/SRT tijdcode om naar seconden.
    function timeToSeconds(time) {
        const clean = time.trim().replace(",", ".");
        const parts = clean.split(":");

        let hours = 0;
        let minutes = 0;
        let seconds = 0;

        if (parts.length === 3) {
            hours = parseInt(parts[0], 10);
            minutes = parseInt(parts[1], 10);
            seconds = parseFloat(parts[2]);
        } else if (parts.length === 2) {
            minutes = parseInt(parts[0], 10);
            seconds = parseFloat(parts[1]);
        }

        return (hours * 3600) + (minutes * 60) + seconds;
    }

    // Parseert VTT/SRT tekst naar bruikbare subtitle-blokken.
    function parseSubtitles(text) {
        const cleaned = text
            .replace(/\r/g, "")
            .replace(/^\uFEFF/, "")
            .replace(/^WEBVTT.*\n/i, "")
            .trim();

        const blocks = cleaned.split(/\n\s*\n/);
        const cues = [];

        for (const block of blocks) {
            const lines = block.split("\n").map(line => line.trim()).filter(Boolean);

            const timeLineIndex = lines.findIndex(line => line.includes("-->"));
            if (timeLineIndex === -1) continue;

            const timeLine = lines[timeLineIndex];
            const timeParts = timeLine.split("-->");

            if (timeParts.length !== 2) continue;

            const start = timeToSeconds(timeParts[0].trim());
            const end = timeToSeconds(timeParts[1].trim().split(/\s+/)[0]);

            const textLines = lines.slice(timeLineIndex + 1);
            const cueText = textLines.join("<br>");

            if (!isNaN(start) && !isNaN(end) && cueText) {
                cues.push({ start, end, text: cueText });
            }
        }

        return cues;
    }






video.addEventListener("error", () => {
    const err = video.error;

    notifyAndroid({
        action: "videoError",
        code: err ? err.code : 0,
        message: err ? err.message : "Unknown video error"
    });

    setStatus("VIDEO ERROR: " + (err ? err.code : "unknown"), 5000);
});



    // Toont elke 100ms de juiste ondertitel op basis van video.currentTime.
    function startSubtitleOverlayRenderer() {
        setInterval(() => {
            if (!video || !subtitleBox || subtitleCues.length === 0) return;
            if (!subtitlesVisible) {
            subtitleBox.innerHTML = "";
            return;
        }

            const now =
            video.currentTime -
            (subtitleOffsetMs / 1000);

            const activeCue = subtitleCues.find(cue =>
                now >= cue.start && now <= cue.end
            );

            subtitleBox.innerHTML = activeCue ? activeCue.text : "";
        }, 100);
    }

    playerManager.setMessageInterceptor(
        cast.framework.messages.MessageType.LOAD,
        requestData => {


            const media = requestData.media;
            const videoUrl = media && media.contentId;
            const tracks = media && media.tracks ? media.tracks : [];

            if (!videoUrl) {
                // setStatus("Geen video URL ontvangen");





                // Deze return requestData laten staan dus.
                return requestData;
            }




clearInterval(loadingTimer);
loadingText.textContent = "";



            // setStatus("Video laden...");
            standbyScreen.style.display = "none";
            video.style.display = "block";
            video.src = videoUrl;
            applyRatioMode(ratioModes[ratioIndex].mode);
            setStatus("Ratio: " + ratioModes[ratioIndex].name);

            if (tracks.length > 0) {
                const firstTextTrack = tracks.find(t => t.type === "TEXT") || tracks[0];
                const subtitleUrl = firstTextTrack.trackContentId;

                if (subtitleUrl) {
                    // setStatus("Subtitle downloaden...");

                    fetch(subtitleUrl)
                        .then(response => response.text())
                        .then(text => {
                            subtitleCues = parseSubtitles(text);



                            startSubtitleOverlayRenderer();
                        })
                        .catch(error => {
                            // setStatus("Subtitle fetch error:\n" + error.message);
                        });
                }
            } else {
                // setStatus("Video zonder subtitle");
            }

            video.load();

            video.play().then(() => {
                // setStatus("VIDEO OK");

                setTimeout(() => {
                    statusBox.style.display = "none";
                }, 3000);
            }).catch(error => {
                // setStatus("Play error:\n" + error.message);
            });

            return requestData;

                    }
    );






context.addCustomMessageListener(CONTROL_NAMESPACE, event => {
    androidSenderId = event.senderId;

    const command = event.data;



    if (!command || !command.action) {
        return;
    }

    if (command.action === "ping") {

    return;
    }

if (command.action === "loadingCountdown") {
    let seconds = Number(command.seconds || 30);

    standbyScreen.style.display = "flex";
    video.style.display = "none";

    clearInterval(loadingTimer);

    loadingText.textContent = "Video laden... " + seconds;

    loadingTimer = setInterval(() => {
        seconds--;

        if (seconds <= 0) {
            clearInterval(loadingTimer);
            loadingText.textContent = "Video laden...";
            return;
        }

        loadingText.textContent = "Video laden... " + seconds;
    }, 1000);

    return;
}

    if (command.action === "pause") {
        video.pause();
        setStatus("PAUSE");
    }

    if (command.action === "play") {
        video.play();
        setStatus("PLAY");
    }

    if (command.action === "toggle") {
        if (video.paused) {
            video.play();
            setStatus("PLAY");
        } else {
            video.pause();
            setStatus("PAUSE");
        }
    }


    if (command.action === "changeRatio") {
    ratioIndex = (ratioIndex + 1) % ratioModes.length;

    const ratio = ratioModes[ratioIndex];

    applyRatioMode(ratio.mode);

    setStatus("Ratio: " + ratio.name);
    }

    if (command.action === "seekBy") {
        const offset = Number(command.offset || 0);
        video.currentTime = Math.max(0, video.currentTime + offset);
        setStatus("SEEK: " + Math.round(video.currentTime) + " sec");
    }


if (command.action === "subtitleVisibility") {

    subtitlesVisible =
        command.visible === true;

    if (!subtitlesVisible) {
        subtitleBox.innerHTML = "";
    }

    setStatus(
        subtitlesVisible
            ? "Subtitles ON"
            : "Subtitles OFF"
    );
}

if (command.action === "subtitleOffset") {

    subtitleOffsetMs =
        Number(command.offset || 0);

    setStatus(
        "Subtitle offset: " +
        subtitleOffsetMs +
        " ms"
    );
}

   if (command.action === "stop") {
    video.pause();

    video.currentTime = 0;
    video.removeAttribute("src");
    video.src = "";
    video.load();

    subtitleBox.innerHTML = "";
    subtitleCues = [];

    video.style.display = "none";
    standbyScreen.style.display = "flex";

    statusBox.style.display = "none";
}






   

});


    context.start();
</script>



</body>
</html>
