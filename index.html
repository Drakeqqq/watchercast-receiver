<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>WatcherCast Receiver</title>

    <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: black;
            overflow: hidden;
        }

        #video {
            width: 100%;
            height: 100%;
            background: black;
        }

        #status {
            position: absolute;
            left: 30px;
            top: 30px;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 28px;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 18px;
            border-radius: 8px;
            z-index: 10;
        }





#subtitleBox {
    position: absolute;

    left: 50%;
    bottom: 80px;

    transform: translateX(-50%);

    color: white;
    font-size: 42px;
    font-family: Arial, sans-serif;
    font-weight: bold;

    text-align: center;

    text-shadow:
        2px 2px 4px black,
        -2px -2px 4px black,
        2px -2px 4px black,
        -2px 2px 4px black;

    max-width: 90%;

    z-index: 9999;
}















    </style>
</head>

<body>
    <div id="status">DRAKE V2</div>

    <video id="video" autoplay controls></video>
    <div id="subtitleBox"></div>










<script>
    const context = cast.framework.CastReceiverContext.getInstance();
    const playerManager = context.getPlayerManager();

    const video = document.getElementById("video");
    const statusBox = document.getElementById("status");
    const subtitleBox = document.getElementById("subtitleBox");

    let subtitleCues = [];

    // Zet status op het TV-scherm + in de Chromecast console.
    function setStatus(text) {
        console.log("WATCHERCAST:", text);
        statusBox.textContent = text;
    }

    // Zet VTT/SRT tijdcode om naar seconden.
    function timeToSeconds(time) {
        const clean = time.trim().replace(",", ".");
        const parts = clean.split(":");

        let hours = 0;
        let minutes = 0;
        let seconds = 0;

        if (parts.length === 3) {
            hours = parseInt(parts[0], 10);
            minutes = parseInt(parts[1], 10);
            seconds = parseFloat(parts[2]);
        } else if (parts.length === 2) {
            minutes = parseInt(parts[0], 10);
            seconds = parseFloat(parts[1]);
        }

        return (hours * 3600) + (minutes * 60) + seconds;
    }

    // Parseert VTT/SRT tekst naar bruikbare subtitle-blokken.
    function parseSubtitles(text) {
        const cleaned = text
            .replace(/\r/g, "")
            .replace(/^\uFEFF/, "")
            .replace(/^WEBVTT.*\n/i, "")
            .trim();

        const blocks = cleaned.split(/\n\s*\n/);
        const cues = [];

        for (const block of blocks) {
            const lines = block.split("\n").map(line => line.trim()).filter(Boolean);

            const timeLineIndex = lines.findIndex(line => line.includes("-->"));
            if (timeLineIndex === -1) continue;

            const timeLine = lines[timeLineIndex];
            const timeParts = timeLine.split("-->");

            if (timeParts.length !== 2) continue;

            const start = timeToSeconds(timeParts[0]);
            const end = timeToSeconds(timeParts[1].split(" ")[0]);

            const textLines = lines.slice(timeLineIndex + 1);
            const cueText = textLines.join("<br>");

            if (!isNaN(start) && !isNaN(end) && cueText) {
                cues.push({ start, end, text: cueText });
            }
        }

        return cues;
    }

    // Toont elke 100ms de juiste ondertitel op basis van video.currentTime.
    function startSubtitleOverlayRenderer() {
        setInterval(() => {
            if (!video || !subtitleBox || subtitleCues.length === 0) return;

            const now = video.currentTime;

            const activeCue = subtitleCues.find(cue =>
                now >= cue.start && now <= cue.end
            );

            subtitleBox.innerHTML = activeCue ? activeCue.text : "";
        }, 100);
    }

    playerManager.setMessageInterceptor(
        cast.framework.messages.MessageType.LOAD,
        requestData => {
            console.log("WATCHERCAST LOAD:", requestData);

            const media = requestData.media;
            const videoUrl = media && media.contentId;
            const tracks = media && media.tracks ? media.tracks : [];

            if (!videoUrl) {
                setStatus("Geen video URL ontvangen");
                return requestData;
            }

            setStatus("Video laden...");
            video.src = videoUrl;

            if (tracks.length > 0) {
                const firstTextTrack = tracks.find(t => t.type === "TEXT") || tracks[0];
                const subtitleUrl = firstTextTrack.trackContentId;

                if (subtitleUrl) {
                    setStatus("Subtitle downloaden...");

                    fetch(subtitleUrl)
                        .then(response => response.text())
                        .then(text => {
                            subtitleCues = parseSubtitles(text);

setStatus(
    "CUES: " + subtitleCues.length +
    "\nSTART: " + subtitleCues[0].start +
    "\nEND: " + subtitleCues[0].end
);

                            startSubtitleOverlayRenderer();
                        })
                        .catch(error => {
                            setStatus("Subtitle fetch error:\n" + error.message);
                        });
                }
            } else {
                setStatus("Video zonder subtitle");
            }

            video.load();

            video.play().then(() => {
                setStatus("VIDEO OK");

                setTimeout(() => {
                    statusBox.style.display = "none";
                }, 3000);
            }).catch(error => {
                setStatus("Play error:\n" + error.message);
            });

            return null;
        }
    );

    context.start();
</script>













</body>
</html>
